<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Sim Game · Scoreboard</title>
  <style>
    :root { font: 15px system-ui, sans-serif; color: #17324d; background: #f3f7fa; }
    body { margin: 0; padding: 1rem; }
    header, main { max-width: 76rem; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { color: #073b5c; } #countdown { font-size: clamp(2rem, 8vw, 4rem); font-variant-numeric: tabular-nums; }
    .card { background: white; border-radius: .8rem; padding: 1rem; margin: 1rem 0; box-shadow: 0 2px 14px #17324d18; }
    input, button { min-height: 2.5rem; padding: .45rem .7rem; font: inherit; }
    button { border: 0; border-radius: .45rem; background: #007ba7; color: white; cursor: pointer; font-weight: 650; }
    button.secondary { background: #e7eef3; color: #17324d; }
    button:disabled { opacity: .5; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .6rem; }
    #connection { font-weight: 650; } .error { color: #a3211a; } .success { color: #167a45; }
    .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: .65rem; border: 1px solid #d5e0e7; text-align: center; }
    th:first-child, td:first-child { text-align: left; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>Line Sim Game</h1><a href="/">Player page</a></header>
  <main>
    <section class="card" aria-label="Game timer">
      <div id="countdown">--:--</div>
      <p id="timer-state">Loading timer…</p>
      <div id="facilitator" hidden>
        <form id="login-form">
          <label for="password">Facilitator password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button>Facilitator login</button>
        </form>
        <div id="controls" hidden>
          <form id="timer-form">
            <label for="duration">Timer duration (seconds)</label>
            <input id="duration" type="number" min="1" max="86400" step="1" value="900" required>
            <div class="actions">
              <button id="start">Start / restart</button>
              <button id="stop" type="button" class="secondary">Stop</button>
              <button id="resume" type="button" class="secondary">Resume</button>
              <button id="timer-reset" type="button" class="secondary">Reset timer</button>
            </div>
          </form>
          <div class="actions">
            <button id="round-reset" type="button" class="secondary">New run / round</button>
            <button id="game-reset" type="button" class="secondary">Reset game</button>
            <button id="logout" type="button" class="secondary">Log out</button>
          </div>
        </div>
      </div>
      <p id="connection" role="status" aria-live="polite">Connecting to scoreboard…</p>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="card table-wrap">
      <table><thead id="head"></thead><tbody id="teams"></tbody></table>
      <p id="empty" hidden>No teams yet. Teams will appear here when they join.</p>
    </section>
  </main>
  <script>
    const api = '/api/vercel';
    const $ = id => document.getElementById(id);
    const qcStations = ['inspect-blister', 'inspect-box'];
    let snapshot;
    let timerOffset = 0;
    let timerHandle;
    let polling = false;
    let refreshDelay = 3000;
    let authenticated = false;

    async function request(path, options = {}) {
      const response = await fetch(api + path, { cache: 'no-store', ...options });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed. Please retry.');
      return data;
    }
    function status(message, kind = '') { $('status').textContent = message; $('status').className = kind; }
    function timerDisplay() {
      if (!snapshot) return;
      const timer = snapshot.timer;
      let seconds;
      if (timer.endsAt !== null) seconds = Math.max(0, Math.ceil((timer.endsAt - (Date.now() + timerOffset)) / 1000));
      else if (timer.remainingSeconds !== null) seconds = timer.remainingSeconds;
      else seconds = timer.durationSeconds;
      $('countdown').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      $('timer-state').textContent = timer.endsAt !== null
        ? seconds > 0 ? 'Timer running' : 'Time is up'
        : timer.remainingSeconds !== null ? 'Timer paused' : 'Ready to start';
    }
    function render(data) {
      snapshot = data;
      timerOffset = data.serverTime - Date.now();
      const head = $('head');
      const body = $('teams');
      head.replaceChildren();
      body.replaceChildren();
      const header = document.createElement('tr');
      ['Team', ...data.stations.map(station => station.name)].forEach(text => {
        const cell = document.createElement('th');
        cell.textContent = text;
        header.append(cell);
      });
      head.append(header);
      $('empty').hidden = data.teams.length > 0;
      data.teams.forEach(team => {
        const row = document.createElement('tr');
        const name = document.createElement('th');
        name.scope = 'row';
        name.textContent = team.name;
        row.append(name);
        data.stations.forEach(station => {
          const cell = document.createElement('td');
          const count = data.counts.find(item => item.teamId === team.id && item.stationId === station.id);
          cell.textContent = count
            ? qcStations.includes(station.id) ? `${count.count} (${count.pass} pass · ${count.fail} fail)` : String(count.count)
            : qcStations.includes(station.id) ? '0 (0 pass · 0 fail)' : '0';
          if (authenticated) {
            const reset = document.createElement('button');
            reset.type = 'button';
            reset.className = 'secondary';
            reset.textContent = 'Reset';
            reset.setAttribute('aria-label', `Reset ${team.name} · ${station.name}`);
            reset.addEventListener('click', () => resetStation(team, station));
            cell.append(document.createElement('br'), reset);
          }
          row.append(cell);
        });
        body.append(row);
      });
      $('duration').value = data.timer.durationSeconds;
      timerDisplay();
    }
    async function refresh() {
      if (polling) return;
      polling = true;
      try {
        const data = await request('/scoreboard');
        render(data);
        $('connection').textContent = 'Connected · scoreboard refreshes every 3 seconds';
        $('connection').className = 'success';
        refreshDelay = 3000;
      } catch (error) {
        $('connection').textContent = `Connection lost: ${error.message} Retrying…`;
        $('connection').className = 'error';
        refreshDelay = Math.min(refreshDelay * 2, 30000);
      } finally {
        polling = false;
        clearTimeout(timerHandle);
        timerHandle = setTimeout(refresh, refreshDelay);
      }
    }
    async function checkSession() {
      try {
        authenticated = (await request('/session')).authenticated;
        $('facilitator').hidden = false;
        $('login-form').hidden = authenticated;
        $('controls').hidden = !authenticated;
        if (snapshot) render(snapshot);
      } catch (error) {
        $('facilitator').hidden = false;
        status(`Facilitator access unavailable: ${error.message}`, 'error');
      }
    }
    async function action(path, payload) {
      try {
        await request(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          ...(payload === undefined ? {} : { body: JSON.stringify(payload) })
        });
        status('Updated.', 'success');
        await refresh();
      } catch (error) {
        status(error.message, 'error');
      }
    }
    async function resetStation(team, station) {
      if (!confirm(`Reset all ${team.name} completions for ${station.name}? This cannot be undone.`)) return;
      await action('/station-reset', { teamId: team.id, stationId: station.id });
    }
    $('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        await request('/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', password: $('password').value })
        });
        $('password').value = '';
        await checkSession();
        await refresh();
      } catch (error) { status(error.message, 'error'); }
    });
    $('timer-form').addEventListener('submit', event => {
      event.preventDefault();
      action('/timer/start', { durationSeconds: Number($('duration').value) });
    });
    $('stop').addEventListener('click', () => action('/timer/stop'));
    $('resume').addEventListener('click', () => action('/timer/resume'));
    $('timer-reset').addEventListener('click', () => action('/timer/reset'));
    $('round-reset').addEventListener('click', () => {
      if (confirm('Clear all completions but keep teams and timer? This cannot be undone.')) action('/round/reset');
    });
    $('game-reset').addEventListener('click', () => {
      if (confirm('Delete all teams and completions and restore a stopped 15-minute timer? This cannot be undone.')) action('/game/reset');
    });
    $('logout').addEventListener('click', async () => {
      await action('/auth', { action: 'logout' });
      authenticated = false;
      checkSession();
    });
    checkSession();
    refresh();
    setInterval(timerDisplay, 250);
  </script>
</body>
</html>
