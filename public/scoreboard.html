<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard | Line Sim Game</title>
  <style>
    :root {
      color-scheme: light;
      --blue-deep: #073b5c;
      --blue: #007ba7;
      --blue-light: #dceff6;
      --silver: #b8c2cc;
      --orange: #b6531d;
      --background: #f4f6f8;
      --card: #fff;
      --text: #17191c;
      --text-secondary: #56616b;
      --border: #d5dce2;
      --shadow: 0 12px 32px rgb(7 59 92 / 16%);
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: linear-gradient(145deg, #0b4568, var(--blue-deep) 60%, #052f4a); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 100rem; margin: auto; padding: clamp(1rem, 3vw, 2.5rem); }
    .page-header { margin: 0 0 1.5rem; color: white; }
    .brand { margin: 0 0 .25rem; color: #d1e8f1; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.8rem, 3vw, 3rem); line-height: 1.15; }
    a { color: #d1e8f1; font-weight: 650; text-underline-offset: .2em; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #f0a15c; outline-offset: 3px; }
    .clock { margin: 1.5rem 0 1rem; padding: clamp(1rem, 3vw, 2rem); border: 1px solid rgb(255 255 255 / 55%); border-radius: 1rem; background: linear-gradient(145deg, #fff, #f3f6f8); box-shadow: var(--shadow); text-align: center; }
    #countdown { color: var(--blue-deep); font-size: clamp(4rem, 12vw, 10rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.04em; line-height: 1; }
    #timer-state { margin: .5rem 0 1rem; color: var(--text-secondary); font-size: 1.25rem; font-weight: 700; }
    form { display: flex; justify-content: center; align-items: end; flex-wrap: wrap; gap: .75rem; }
    label { display: grid; gap: .25rem; color: var(--text-secondary); font-size: .9rem; font-weight: 700; text-align: left; }
    input, button { min-height: 2.9rem; border: 1px solid var(--border); border-radius: .55rem; padding: .6rem .8rem; font: inherit; }
    input { width: 9rem; background: white; color: var(--text); }
    button { border-color: transparent; background: var(--orange); color: white; font-weight: 750; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    #reset { border-color: var(--border); background: var(--blue-light); color: var(--blue-deep); }
    #status { min-height: 1.5em; margin: .5rem 0 1rem; color: #fff0d9; font-weight: 700; text-align: center; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: .9rem; background: var(--card); box-shadow: var(--shadow); }
    table { width: 100%; min-width: 54rem; border-collapse: collapse; font-size: clamp(1rem, 1.4vw, 1.4rem); }
    th, td { padding: .8rem .65rem; border: 1px solid var(--border); text-align: center; }
    thead th { background: linear-gradient(110deg, var(--blue-deep), var(--blue)); color: white; font-size: .88em; font-weight: 750; }
    tbody tr:nth-child(even) { background: #f2f7f9; }
    tbody th { min-width: 9rem; background: #fff; color: var(--blue-deep); font-size: 1.1em; text-align: left; }
    tbody tr:nth-child(3n + 1) th { border-left: .4rem solid var(--blue); }
    tbody tr:nth-child(3n + 2) th { border-left: .4rem solid var(--orange); }
    tbody tr:nth-child(3n) th { border-left: .4rem solid var(--silver); }
    td { color: var(--text); font-size: 1.35em; font-weight: 800; font-variant-numeric: tabular-nums; }
    .qc { display: block; color: var(--text-secondary); font-size: .65em; font-weight: 650; white-space: nowrap; }
    #empty { padding: 1rem; border: 1px solid rgb(255 255 255 / 35%); border-radius: .65rem; color: white; text-align: center; }
    @media (max-width: 40rem) {
      .clock { margin-top: 1rem; }
      form { align-items: stretch; }
      form label, form button { width: 100%; }
      input { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <p class="brand">VitaNova MES</p>
      <h1>Production scoreboard</h1>
      <a href="/">Station screen</a>
    </header>
    <section class="clock" aria-label="Countdown">
      <div id="countdown">--:--</div>
      <p id="timer-state">Loading timer…</p>
      <form id="timer-form">
        <label>Duration (seconds)
          <input id="duration" type="number" min="1" max="86400" step="1" value="900" required>
        </label>
        <button type="submit">Start / restart</button>
        <button id="reset" type="button">Reset timer</button>
      </form>
    </section>
    <p id="status" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead id="head"></thead>
        <tbody id="teams"></tbody>
      </table>
    </div>
    <p id="empty" hidden>No teams yet. Teams will appear here when they join.</p>
  </main>
  <script>
    const countdown = document.querySelector('#countdown');
    const timerState = document.querySelector('#timer-state');
    const duration = document.querySelector('#duration');
    const status = document.querySelector('#status');
    const head = document.querySelector('#head');
    const teams = document.querySelector('#teams');
    const empty = document.querySelector('#empty');
    const qcStations = new Set(['inspect-blister', 'inspect-box']);
    let timer = null;
    let serverOffset = 0;
    let initialized = false;
    let loading = false;
    let refreshNeeded = false;
    let connected = false;
    let loadFailed = false;
    let retryTimer = null;

    function showStatus() {
      status.textContent = loadFailed ? 'Could not load scoreboard. Waiting to retry…' :
        connected ? '' : 'Live connection lost. Reconnecting…';
    }

    function renderClock() {
      if (!timer) return;
      const seconds = timer.endsAt === null ? timer.durationSeconds :
        Math.max(0, Math.ceil((timer.endsAt - (Date.now() + serverOffset)) / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;
      countdown.textContent = hours ? `${hours}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}` :
        `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
      timerState.textContent = timer.endsAt === null ? 'Ready' : seconds ? 'Time remaining' : 'Time is up';
    }

    function render(data) {
      timer = data.timer;
      serverOffset = data.serverTime - Date.now();
      if (!initialized) {
        duration.value = timer.durationSeconds;
        initialized = true;
      }
      renderClock();
      const header = document.createElement('tr');
      const teamHeader = document.createElement('th');
      teamHeader.scope = 'col';
      teamHeader.textContent = 'Team';
      header.append(teamHeader);
      for (const station of data.stations) {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = station.name;
        header.append(cell);
      }
      head.replaceChildren(header);
      const rows = data.teams.map(team => {
        const row = document.createElement('tr');
        const name = document.createElement('th');
        name.scope = 'row';
        name.textContent = team.name;
        row.append(name);
        for (const station of data.stations) {
          const count = data.counts.find(item => item.teamId === team.id && item.stationId === station.id);
          const cell = document.createElement('td');
          cell.textContent = count?.count || 0;
          if (qcStations.has(station.id)) {
            const detail = document.createElement('span');
            detail.className = 'qc';
            detail.textContent = `Pass ${count?.pass || 0} / Fail ${count?.fail || 0}`;
            cell.append(detail);
          }
          row.append(cell);
        }
        return row;
      });
      teams.replaceChildren(...rows);
      empty.hidden = data.teams.length > 0;
    }

    async function refresh() {
      refreshNeeded = true;
      if (loading) return;
      loading = true;
      while (refreshNeeded) {
        refreshNeeded = false;
        try {
          const response = await fetch('/api/scoreboard', { cache: 'no-store' });
          if (!response.ok) throw new Error('Request failed');
          render(await response.json());
          loadFailed = false;
          clearTimeout(retryTimer);
          retryTimer = null;
        } catch {
          loadFailed = true;
          if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; refresh(); }, 3000);
        }
        showStatus();
      }
      loading = false;
    }

    async function updateTimer(url, options) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) throw new Error('Request failed');
        refresh();
      } catch {
        status.textContent = 'Could not update timer. Please try again.';
      }
    }

    document.querySelector('#timer-form').addEventListener('submit', event => {
      event.preventDefault();
      updateTimer('/api/timer', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ durationSeconds: Number(duration.value) })
      });
    });
    document.querySelector('#reset').addEventListener('click', () => {
      updateTimer('/api/timer/reset', { method: 'POST' });
    });
    const stream = new EventSource('/api/events/stream');
    stream.addEventListener('open', () => { connected = true; showStatus(); refresh(); });
    stream.addEventListener('error', () => { connected = false; showStatus(); });
    for (const type of ['team', 'completion', 'reset', 'timer']) stream.addEventListener(type, refresh);
    setInterval(renderClock, 250);
    refresh();
  </script>
</body>
</html>
