<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Sim Game · Scoreboard</title>
  <style>
    :root {
      font: 16px/1.45 system-ui, sans-serif;
      color: #17191c;
      background: #073b5c;
      --blue-deep: #073b5c;
      --blue: #007ba7;
      --blue-light: #dceff6;
      --orange: #b6531d;
      --border: #d5dce2;
      --muted: #56616b;
      --focus: #f0a15c;
    }
    body { min-height: 100vh; margin: 0; padding: clamp(.75rem, 2.5vw, 2rem); background: linear-gradient(145deg, #073b5c, #0b5678 58%, #073b5c); }
    header, main { max-width: 94rem; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 .25rem; }
    h1 { color: white; font-size: clamp(1.6rem, 3vw, 2.25rem); letter-spacing: -.025em; }
    header a { color: white; font-weight: 650; }
    #countdown { color: var(--blue-deep); font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.04em; line-height: 1; }
    .card { margin: 1rem 0; padding: clamp(1rem, 2.5vw, 1.75rem); border: 1px solid #ffffff80; border-top: 4px solid #b8c2cc; border-radius: .8rem; background: white; box-shadow: 0 .75rem 2rem #001b2b40; }
    #timer-state { margin: .65rem 0 1.25rem; color: var(--muted); font-size: 1.1rem; font-weight: 700; }
    label { color: var(--blue-deep); font-weight: 700; }
    input, button { min-height: 2.8rem; padding: .55rem .8rem; font: inherit; }
    input { border: 1px solid #aeb9c2; border-radius: .45rem; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button { border: 0; border-radius: .45rem; background: var(--blue); color: white; cursor: pointer; font-weight: 700; box-shadow: 0 2px 5px #073b5c24; }
    #start { background: var(--orange); }
    button.secondary { border: 1px solid var(--border); background: #e5e9ed; color: var(--blue-deep); box-shadow: none; }
    #game-reset { border-color: #b42318; color: #9c2018; }
    button:disabled { opacity: .5; cursor: wait; }
    .actions { display: flex; flex-wrap: nowrap; gap: .55rem; margin-top: .65rem; overflow-x: auto; }
    #connection, #status { font-weight: 700; }
    #connection { margin-bottom: 0; }
    .error { color: #b42318; } .success { color: #167a45; }
    .table-wrap { overflow-x: auto; padding: .5rem; }
    table { width: 100%; min-width: 62rem; border-collapse: separate; border-spacing: 0; background: white; }
    th, td { padding: .85rem .75rem; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: center; }
    thead th { position: sticky; top: 0; border-color: #315d75; background: var(--blue-deep); color: white; font-size: 1rem; line-height: 1.3; }
    thead th:first-child { border-top-left-radius: .45rem; }
    thead th:last-child { border-top-right-radius: .45rem; }
    tbody th { border-left: 4px solid var(--blue); background: #f4f6f8; color: var(--blue-deep); font-weight: 750; }
    tbody tr:nth-child(3n + 2) th { border-left-color: var(--orange); }
    tbody tr:nth-child(3n) th { border-left-color: #167a45; }
    td { color: #17191c; font-size: clamp(1rem, 1.5vw, 1.25rem); font-variant-numeric: tabular-nums; font-weight: 700; }
    tbody tr:nth-child(even) td { background: #f8fafb; }
    th:first-child, td:first-child { text-align: left; }
    #empty { padding: 1rem; color: var(--muted); }
    [hidden] { display: none !important; }
    @media (max-width: 40rem) {
      header { align-items: flex-start; }
      .actions button { flex: 0 0 auto; }
      #duration { width: 100%; }
    }
  </style>
</head>
<body>
  <header><h1>Line Sim Game</h1></header>
  <main>
    <section class="card" aria-label="Game timer">
      <div id="countdown">--:--</div>
      <p id="timer-state">Loading timer…</p>
      <div id="controls">
        <form id="timer-form">
          <label for="duration">Timer duration (seconds)</label>
          <input id="duration" type="number" min="1" max="86400" step="1" value="900" required>
          <div class="actions">
            <button id="start">Start</button>
            <button id="round-reset" type="button" class="secondary">New Run</button>
            <button id="game-reset" type="button" class="secondary">Reset Game</button>
          </div>
        </form>
      </div>
      <p id="connection" role="status" aria-live="polite">Connecting to scoreboard…</p>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="card table-wrap">
      <table><thead id="head"></thead><tbody id="teams"></tbody></table>
      <p id="empty" hidden>No teams yet. Teams will appear here when they join.</p>
    </section>
  </main>
  <script>
    const api = '/api/vercel';
    const $ = id => document.getElementById(id);
    const qcStations = ['inspect-blister', 'inspect-box'];
    let snapshot;
    let timerOffset = 0;
    let timerHandle;
    let polling = false;
    let refreshDelay = 3000;

    async function request(path, options = {}) {
      const response = await fetch(api + path, { cache: 'no-store', ...options });
      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`Unexpected server response (${response.status}). Please retry.`);
      }
      if (!response.ok) throw new Error(data.error || 'Request failed. Please retry.');
      return data;
    }
    function status(message, kind = '') { $('status').textContent = message; $('status').className = kind; }
    function timerRunning() {
      return Boolean(snapshot && snapshot.timer.endsAt !== null && snapshot.timer.endsAt > Date.now() + timerOffset);
    }
    function timerDisplay() {
      if (!snapshot) return;
      const timer = snapshot.timer;
      const running = timerRunning();
      let seconds;
      if (timer.endsAt !== null) seconds = Math.max(0, Math.ceil((timer.endsAt - (Date.now() + timerOffset)) / 1000));
      else if (timer.remainingSeconds !== null) seconds = timer.remainingSeconds;
      else seconds = timer.durationSeconds;
      $('countdown').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      $('start').textContent = running ? 'Stop' : 'Start';
      $('timer-state').textContent = timer.endsAt !== null
        ? seconds > 0 ? 'Timer running' : 'Time is up'
        : timer.remainingSeconds !== null ? 'Timer paused' : 'Ready to start';
    }
    function render(data) {
      snapshot = data;
      timerOffset = data.serverTime - Date.now();
      const head = $('head');
      const body = $('teams');
      head.replaceChildren();
      body.replaceChildren();
      const header = document.createElement('tr');
      ['Team', ...data.stations.map(station => station.name)].forEach(text => {
        const cell = document.createElement('th');
        cell.textContent = text;
        header.append(cell);
      });
      head.append(header);
      $('empty').hidden = data.teams.length > 0;
      data.teams.forEach(team => {
        const row = document.createElement('tr');
        const name = document.createElement('th');
        name.scope = 'row';
        name.textContent = team.name;
        row.append(name);
        data.stations.forEach(station => {
          const cell = document.createElement('td');
          const count = data.counts.find(item => item.teamId === team.id && item.stationId === station.id);
          cell.textContent = count
            ? qcStations.includes(station.id) ? `${count.count} (${count.pass} pass · ${count.fail} fail)` : String(count.count)
            : qcStations.includes(station.id) ? '0 (0 pass · 0 fail)' : '0';
          row.append(cell);
        });
        body.append(row);
      });
      $('duration').value = data.timer.durationSeconds;
      timerDisplay();
    }
    async function refresh() {
      if (polling) return;
      polling = true;
      try {
        const data = await request('/scoreboard');
        render(data);
        $('connection').textContent = 'Connected · scoreboard refreshes every 3 seconds';
        $('connection').className = 'success';
        refreshDelay = 3000;
      } catch (error) {
        $('connection').textContent = `Connection lost: ${error.message} Retrying…`;
        $('connection').className = 'error';
        refreshDelay = Math.min(refreshDelay * 2, 30000);
      } finally {
        polling = false;
        clearTimeout(timerHandle);
        timerHandle = setTimeout(refresh, refreshDelay);
      }
    }
    async function action(path, payload) {
      try {
        await request(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          ...(payload === undefined ? {} : { body: JSON.stringify(payload) })
        });
        status('Updated.', 'success');
        await refresh();
      } catch (error) {
        status(error.message, 'error');
      }
    }
    $('timer-form').addEventListener('submit', event => {
      event.preventDefault();
      if (timerRunning()) action('/timer-stop');
      else action('/timer-start', { durationSeconds: Number($('duration').value) });
    });
    $('round-reset').addEventListener('click', () => {
      if (confirm('Clear all completions but keep teams and timer? This cannot be undone.')) action('/round-reset');
    });
    $('game-reset').addEventListener('click', () => {
      if (confirm('Delete all teams and completions and restore a stopped 15-minute timer? This cannot be undone.')) action('/game-reset');
    });
    refresh();
    setInterval(timerDisplay, 250);
  </script>
</body>
</html>
