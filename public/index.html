<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Sim Game · Player</title>
  <style>
    :root {
      font: 16px/1.5 system-ui, sans-serif;
      color: #17191c;
      background: #f4f6f8;
      --blue-deep: #073b5c;
      --blue: #007ba7;
      --blue-light: #dceff6;
      --orange: #b6531d;
      --border: #d5dce2;
      --muted: #56616b;
      --focus: #f0a15c;
    }
    body { max-width: 42rem; margin: 0 auto; padding: clamp(1rem, 4vw, 2rem); }
    main {
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: clamp(1.25rem, 5vw, 2rem);
      box-shadow: 0 .75rem 2rem #073b5c14;
    }
    h1 {
      margin: -.25rem calc(clamp(1.25rem, 5vw, 2rem) * -1) 1rem;
      padding: 1.25rem clamp(1.25rem, 5vw, 2rem);
      border-bottom: 4px solid #b8c2cc;
      background: linear-gradient(115deg, #073b5c, #0b5678 72%, #007ba7);
      color: white;
      font-size: clamp(1.6rem, 6vw, 2rem);
      letter-spacing: -.025em;
    }
    p { color: var(--muted); }
    label { display: block; margin: 1.2rem 0 .4rem; color: var(--blue-deep); font-weight: 700; }
    select, input, button {
      box-sizing: border-box;
      width: 100%;
      min-height: 3rem;
      padding: .65rem .8rem;
      font: inherit;
    }
    select, input {
      border: 1px solid #aeb9c2;
      border-radius: .55rem;
      background: white;
      color: #17191c;
    }
    select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button {
      margin-top: .6rem;
      border: 0;
      border-radius: .55rem;
      background: var(--blue-deep);
      color: white;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 2px 5px #073b5c24;
    }
    #join { background: var(--orange); }
    #pass { background: #167a45; }
    #fail { background: #b42318; }
    button.secondary { border: 1px solid var(--border); background: #e5e9ed; color: var(--blue-deep); box-shadow: none; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: flex; gap: .75rem; }
    .row button { flex: 1; min-height: 3.5rem; }
    #player { margin-top: 1.5rem; }
    .team-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .team-row p { margin: 0; }
    #count { color: var(--blue-deep); font-size: 2.5rem; line-height: 1; }
    #team-label { color: var(--blue-deep); }
    #undo, #done { min-height: 6rem; font-size: 1.25rem; color: white; }
    #undo { border: 0; background: #b6531d; box-shadow: 0 2px 5px #073b5c24; }
    #done { background: linear-gradient(#1b9b58, #167a45); }
    #timer { padding: .75rem 1rem; border-left: 4px solid var(--blue); border-radius: .3rem; background: var(--blue-light); color: var(--blue-deep); font-weight: 700; }
    #status { min-height: 1.5rem; font-weight: 650; }
    summary { color: var(--blue-deep); font-weight: 700; cursor: pointer; }
    .error { color: #b42318; } .success { color: #167a45; }
    a { color: var(--blue); font-weight: 650; }
    [hidden] { display: none !important; }
    @media (max-width: 22rem) {
      .row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Line Sim Game</h1>
    <form id="team-form">
      <label for="team-choice">Existing team</label>
      <select id="team-choice"><option value="">Choose a team</option></select>
      <label for="team-name">Or create/join by name</label>
      <input id="team-name" maxlength="80" autocomplete="off">
      <button id="join">Join team</button>
    </form>
    <section id="player" hidden>
      <div class="team-row">
        <p>Team: <strong id="team-label"></strong></p>
        <strong id="count" aria-label="Your recorded completions">0</strong>
      </div>
      <div id="standard">
        <div class="row"><button id="undo" type="button">Oops! -1</button><button id="done" type="button">Done! +1</button></div>
      </div>
      <div id="qc" hidden>
        <p>Team QC results: <strong id="qc-count">0 pass · 0 fail</strong></p>
        <div class="row"><button id="pass" type="button">Pass</button><button id="fail" type="button">Fail</button></div>
      </div>
      <p id="timer">Checking game timer…</p>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="settings" hidden>
      <details>
        <summary>☰ Settings</summary>
        <button id="change-team" class="secondary" type="button">Change team</button>
        <label for="station">Station</label>
        <select id="station"></select>
      </details>
    </section>
  </main>
  <script>
    const api = '/api/vercel';
    const qcStations = ['inspect-blister', 'inspect-box'];
    const $ = id => document.getElementById(id);
    const teamForm = $('team-form');
    const teamChoice = $('team-choice');
    const teamName = $('team-name');
    const player = $('player');
    const stationSelect = $('station');
    const status = $('status');
    let teams = [];
    let team;
    let playerId = localStorage.getItem('line-sim-vercel-player-id');
    let pendingId;
    let pendingResult;
    let pendingUndo;
    let lastEventId;
    let refreshRunning = false;
    if (!playerId) {
      playerId = crypto.randomUUID();
      localStorage.setItem('line-sim-vercel-player-id', playerId);
    }

    async function request(path, options = {}) {
      const response = await fetch(api + path, { cache: 'no-store', ...options });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed. Please retry.');
      return data;
    }
    function showStatus(message, kind = '') {
      status.textContent = message;
      status.className = kind;
    }
    function selectedQc() { return qcStations.includes(stationSelect.value); }
    async function refresh() {
      if (!team || refreshRunning) return;
      refreshRunning = true;
      try {
        const [board, completions] = await Promise.all([
          request('/scoreboard'),
          request(`/completions?playerId=${encodeURIComponent(playerId)}&stationId=${encodeURIComponent(stationSelect.value)}&teamId=${encodeURIComponent(team.id)}`)
        ]);
        $('timer').textContent = board.timer.endsAt && board.timer.endsAt > board.serverTime
          ? 'Game timer is running.'
          : board.timer.endsAt ? 'Time is up.'
          : board.timer.remainingSeconds > 0 ? `Timer paused · ${board.timer.remainingSeconds}s remaining.` : 'Timer is not running.';
        if (selectedQc()) {
          const result = await request(`/qc-counts?teamId=${encodeURIComponent(team.id)}&stationId=${encodeURIComponent(stationSelect.value)}`);
          $('qc-count').textContent = `${result.pass} pass · ${result.fail} fail`;
        } else {
          $('count').textContent = completions.count;
          lastEventId = completions.lastEventId;
          $('undo').disabled = !lastEventId || Boolean(pendingId);
        }
      } catch (error) {
        showStatus(`${error.message} Progress could not be refreshed.`, 'error');
      } finally {
        refreshRunning = false;
      }
    }
    function selectTeam(selected) {
      team = selected;
      $('team-label').textContent = team.name;
      teamForm.hidden = true;
      player.hidden = false;
      $('settings').hidden = false;
      localStorage.setItem('line-sim-vercel-team-id', team.id);
      refresh();
    }
    async function record(result) {
      if (!team || pendingUndo) return;
      if (!pendingId) {
        pendingId = crypto.randomUUID();
        pendingResult = result ?? null;
      }
      const input = {
        id: pendingId, playerId, teamId: team.id, stationId: stationSelect.value,
        ...(pendingResult ? { result: pendingResult } : {})
      };
      ['done', 'pass', 'fail', 'undo'].forEach(id => { $(id).disabled = true; });
      stationSelect.disabled = true;
      $('change-team').disabled = true;
      showStatus('Saving completion…');
      try {
        await request('/events', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input)
        });
        pendingId = null;
        pendingResult = null;
        showStatus('Completion recorded.', 'success');
        await refresh();
      } catch (error) {
        showStatus(`${error.message} Retry the same action to safely confirm it.`, 'error');
      } finally {
        $('done').disabled = Boolean(pendingId && pendingResult !== null);
        $('pass').disabled = Boolean(pendingId) && pendingResult !== 'pass';
        $('fail').disabled = Boolean(pendingId) && pendingResult !== 'fail';
        $('undo').disabled = Boolean(pendingId) || Boolean(pendingUndo) || !lastEventId;
        stationSelect.disabled = Boolean(pendingId) || Boolean(pendingUndo);
        $('change-team').disabled = Boolean(pendingId) || Boolean(pendingUndo);
        $('done').textContent = pendingId && pendingResult === null ? 'Retry completion' : 'Done! +1';
      }
    }
    $('team-form').addEventListener('submit', async event => {
      event.preventDefault();
      const existing = teams.find(item => item.id === teamChoice.value);
      const name = teamName.value.trim();
      if (!existing && !name) return showStatus('Choose a team or enter a team name.', 'error');
      $('join').disabled = true;
      try {
        const selected = name ? await request('/teams', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
        }) : existing;
        selectTeam(selected);
      } catch (error) {
        showStatus(error.message, 'error');
      } finally {
        $('join').disabled = false;
      }
    });
    teamChoice.addEventListener('change', () => { if (teamChoice.value) teamName.value = ''; });
    teamName.addEventListener('input', () => { if (teamName.value) teamChoice.value = ''; });
    stationSelect.addEventListener('change', () => {
      localStorage.setItem('line-sim-vercel-station-id', stationSelect.value);
      $('standard').hidden = selectedQc();
      $('qc').hidden = !selectedQc();
      $('count').hidden = selectedQc();
      refresh();
    });
    $('done').addEventListener('click', () => record());
    $('pass').addEventListener('click', () => record('pass'));
    $('fail').addEventListener('click', () => record('fail'));
    $('undo').addEventListener('click', async () => {
      if (!pendingUndo) pendingUndo = lastEventId;
      if (!pendingUndo) return;
      const eventId = pendingUndo;
      ['done', 'pass', 'fail'].forEach(id => { $(id).disabled = true; });
      $('undo').disabled = true;
      stationSelect.disabled = true;
      $('change-team').disabled = true;
      try {
        await request('/completion-undo', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: eventId, playerId, teamId: team.id, stationId: stationSelect.value })
        });
        pendingUndo = null;
        lastEventId = null;
        $('undo').textContent = 'Oops! -1';
        showStatus('Latest completion removed.', 'success');
        await refresh();
      } catch (error) {
        $('undo').textContent = 'Retry undo';
        showStatus(`${error.message} Retry the correction.`, 'error');
      } finally {
        $('undo').disabled = !pendingUndo && !lastEventId;
        $('done').disabled = Boolean(pendingId);
        $('pass').disabled = Boolean(pendingId);
        $('fail').disabled = Boolean(pendingId);
        stationSelect.disabled = Boolean(pendingId) || Boolean(pendingUndo);
        $('change-team').disabled = Boolean(pendingId) || Boolean(pendingUndo);
      }
    });
    $('change-team').addEventListener('click', () => {
      team = null;
      player.hidden = true;
      $('settings').hidden = true;
      $('settings').querySelector('details').open = false;
      teamForm.hidden = false;
    });
    Promise.all([request('/stations'), request('/teams')]).then(([stations, response]) => {
      teams = response;
      teams.forEach(item => teamChoice.add(new Option(item.name, item.id)));
      stations.forEach(item => stationSelect.add(new Option(item.name, item.id)));
      const lastStation = localStorage.getItem('line-sim-vercel-station-id');
      if (stations.some(item => item.id === lastStation)) stationSelect.value = lastStation;
      stationSelect.dispatchEvent(new Event('change'));
      const savedTeam = teams.find(item => item.id === localStorage.getItem('line-sim-vercel-team-id'));
      if (savedTeam) selectTeam(savedTeam);
    }).catch(error => showStatus(`${error.message} Refresh to retry.`, 'error'));
    setInterval(() => { if (team) refresh(); }, 10000);
  </script>
</body>
</html>
