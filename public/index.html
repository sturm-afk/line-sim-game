<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Sim Game</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fa; color: #172338; font: 18px system-ui, sans-serif; }
    main { max-width: 32rem; margin: auto; padding: 2rem 1.25rem; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    p { line-height: 1.5; }
    label { display: block; font-weight: 600; margin-bottom: .5rem; }
    input, button { font: inherit; border-radius: .6rem; }
    input, select { width: 100%; padding: .8rem; border: 1px solid #718096; border-radius: .6rem; font: inherit; }
    button { cursor: pointer; border: 0; font-weight: 700; }
    button:disabled { opacity: .6; cursor: wait; }
    #join { margin-top: .75rem; padding: .8rem 1.25rem; background: #263d5a; color: white; }
    #complete { width: 100%; min-height: 8rem; margin-top: 1rem; padding: 1.5rem; background: #087c57; color: white; font-size: 1.6rem; }
    #status { min-height: 3rem; font-weight: 600; }
    .error { color: #a32121; }
    .success { color: #087048; }
    .hint { font-size: .9rem; color: #48566b; }
  </style>
</head>
<body>
  <main>
    <p>Line Sim Game</p>
    <h1 id="station-title">Production station</h1>
    <label for="station-select">Station</label>
    <select id="station-select" disabled></select>
    <form id="team-form">
      <label for="team-select">Select your team</label>
      <select id="team-select">
        <option value="">Choose an existing team</option>
      </select>
      <label for="team-name">Or enter a team name</label>
      <input id="team-name" name="team" maxlength="80" autocomplete="off">
      <button id="join" type="submit">Join team</button>
    </form>
    <section id="station" hidden>
      <p>Team: <strong id="team-label"></strong> · <span aria-live="polite">Your recorded completions for this team: <strong id="completion-count">0</strong></span></p>
      <p class="hint">Your player, team, and station selections are saved on this device.</p>
      <button id="complete" type="button">Complete</button>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="change-team" type="button">Change team</button>
    </section>
  </main>
  <script>
    const form = document.querySelector('#team-form');
    const teamName = document.querySelector('#team-name');
    const teamSelect = document.querySelector('#team-select');
    const stationSelect = document.querySelector('#station-select');
    const station = document.querySelector('#station');
    const stationTitle = document.querySelector('#station-title');
    const label = document.querySelector('#team-label');
    const complete = document.querySelector('#complete');
    const status = document.querySelector('#status');
    const completionCount = document.querySelector('#completion-count');
    const changeTeam = document.querySelector('#change-team');
    let team = null;
    let pendingId = null;
    let completionIds = new Set();
    let statusTimer = null;
    let eventSource = null;
    let teams = [];
    let stations = [];
    let playerId = localStorage.getItem('line-sim-player-id');

    if (!playerId) {
      playerId = newId();
      localStorage.setItem('line-sim-player-id', playerId);
    }

    function showStatus(message, kind) {
      clearTimeout(statusTimer);
      status.textContent = message;
      status.className = kind || '';
      if (kind === 'success') {
        statusTimer = setTimeout(() => showStatus('', ''), 2500);
      }
    }

    function addCompletion(event) {
      if (event.teamId !== team?.id || event.playerId !== playerId) return;
      completionIds.add(event.id);
      completionCount.textContent = completionIds.size;
    }

    async function refreshCompletions(selected) {
      try {
        const events = await request(`/api/events?teamId=${encodeURIComponent(selected.id)}`);
        if (team?.id !== selected.id) return;
        events.forEach(addCompletion);
      } catch {}
    }

    function showTeam(selected) {
      eventSource?.close();
      team = selected;
      completionIds = new Set();
      completionCount.textContent = '0';
      label.textContent = team.name;
      if (!teams.some(item => item.id === team.id)) {
        teams.push(team);
        teamSelect.add(new Option(team.name, team.id));
      }
      localStorage.setItem('line-sim-team-id', team.id);
      teamSelect.value = team.id;
      form.hidden = true;
      station.hidden = false;
      const url = new URL(location.href);
      url.searchParams.set('team', team.id);
      history.replaceState(null, '', url);
      refreshCompletions(selected);
      eventSource = new EventSource(`/api/events/stream?teamId=${encodeURIComponent(team.id)}`);
      eventSource.addEventListener('completion', event => addCompletion(JSON.parse(event.data)));
      eventSource.addEventListener('open', () => refreshCompletions(selected));
    }

    function selectStation(stationId) {
      const selected = stations.find(item => item.id === stationId);
      if (!selected) return;
      stationSelect.value = selected.id;
      stationTitle.textContent = selected.name;
      document.title = `${selected.name} | Line Sim Game`;
      localStorage.setItem('line-sim-station-id', selected.id);
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }

    function newId() {
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;
      const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    stationSelect.addEventListener('change', () => selectStation(stationSelect.value));
    teamSelect.addEventListener('change', () => {
      if (teamSelect.value) teamName.value = '';
    });
    teamName.addEventListener('input', () => {
      if (teamName.value) teamSelect.value = '';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      form.querySelector('button').disabled = true;
      try {
        const existing = teams.find(item => item.id === teamSelect.value);
        const name = teamName.value.trim();
        if (!name && !existing) throw new Error('Choose a team or enter a team name.');
        const selected = name ? await request('/api/teams', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        }) : existing;
        showTeam(selected);
      } catch (error) {
        alert(error.message || 'Could not join the team. Please try again.');
      } finally {
        form.querySelector('button').disabled = false;
      }
    });

    complete.addEventListener('click', async () => {
      complete.disabled = true;
      changeTeam.disabled = true;
      stationSelect.disabled = true;
      showStatus('Saving completion…');
      try {
        pendingId ||= newId();
        await request('/api/events', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: pendingId, playerId, teamId: team.id, stationId: stationSelect.value
          })
        });
        pendingId = null;
        complete.textContent = 'Complete';
        showStatus('Completed and recorded. Ready for the next one!', 'success');
      } catch (error) {
        complete.textContent = 'Retry';
        showStatus('Could not confirm completion. Tap Retry before continuing.', 'error');
      } finally {
        complete.disabled = false;
        changeTeam.disabled = Boolean(pendingId);
        stationSelect.disabled = Boolean(pendingId);
      }
    });

    changeTeam.addEventListener('click', () => {
      eventSource?.close();
      eventSource = null;
      team = null;
      station.hidden = true;
      form.hidden = false;
      showStatus('');
      const url = new URL(location.href);
      url.searchParams.delete('team');
      history.replaceState(null, '', url);
    });

    Promise.all([request('/api/stations'), request('/api/teams')]).then(([availableStations, availableTeams]) => {
      stations = availableStations;
      teams = availableTeams;
      stations.forEach(item => stationSelect.add(new Option(item.name, item.id)));
      teams.forEach(item => teamSelect.add(new Option(item.name, item.id)));
      stationSelect.disabled = false;
      const savedStation = localStorage.getItem('line-sim-station-id');
      selectStation(stations.some(item => item.id === savedStation) ? savedStation : stations[0]?.id);
      const urlTeamId = new URL(location.href).searchParams.get('team');
      const savedTeamId = urlTeamId || localStorage.getItem('line-sim-team-id');
      const selected = teams.find(item => item.id === savedTeamId);
      if (selected) showTeam(selected);
    }).catch(() => showStatus('Could not load teams and stations. Refresh to try again.', 'error'));
  </script>
</body>
</html>
